name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Placeholder, non-secret values so `next build` can load src/lib/env.ts. CI-only; all providers are fakes.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_placeholder
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-dummy-secret-not-for-real-use-0123456789
      AI_PROVIDER: mock
      EMBEDDINGS_PROVIDER: fake
      STORAGE_PROVIDER: local
      MAIL_PROVIDER: console
      EMAIL_FROM: "AI Job Hunter <noreply@example.com>"
      CRON_SECRET: ci-only-dummy-cron-secret
      TURNSTILE_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      db-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobhunter_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:int

  e2e:
    runs-on: ubuntu-latest
    services:
      db-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobhunter_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The Playwright config sets the app's environment itself (all fakes, the db-test service above).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
